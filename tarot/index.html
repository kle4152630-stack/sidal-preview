<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>타로친구 AI</title>
    <style>
        :root {
            --bg-color: #212121;
            --text-main: #ececec;
            --text-sub: #b4b4b4;
            --ai-bubble: #2f2f2f;
            --user-bubble: #3b3b3b;
            --border-color: #383838;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; justify-content: space-between; }

        .chat-header { padding: 14px 20px; background: var(--bg-color); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500; color: var(--text-main); }

        .chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; max-width: 768px; width: 100%; margin: 0 auto; }

        .message-row { display: flex; gap: 16px; width: 100%; line-height: 1.6; font-size: 15px; }
        .message-row.user { justify-content: flex-end; }

        .avatar { width: 30px; height: 30px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: bold; flex-shrink: 0; }
        .message-row.ai .avatar { background: #10a37f; color: #fff; }
        .message-row.user .avatar { background: #5436da; color: #fff; }

        .bubble { max-width: 80%; padding: 4px 0; word-break: break-word; }
        .message-row.user .bubble { background: var(--user-bubble); padding: 10px 14px; border-radius: 12px; }

        .chips { display: flex; gap: 8px; flex-wrap: wrap; padding-left: 46px; }
        .chip { background: var(--ai-bubble); color: var(--text-main); border: 1px solid #424242; border-radius: 16px; padding: 8px 14px; font-size: 14px; cursor: pointer; min-height: 44px; }

        .input-wrapper-area { padding: 16px; background: var(--bg-color); display: flex; justify-content: center; border-top: 1px solid var(--border-color); }
        .input-box { max-width: 768px; width: 100%; background: #2f2f2f; border-radius: 16px; display: flex; align-items: center; padding: 10px 16px; border: 1px solid #424242; }
        .input-box input { flex: 1; background: transparent; border: none; color: #fff; font-size: 15px; outline: none; }
        .send-btn { background: #ececec; border: none; border-radius: 50%; width: 32px; height: 32px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #212121; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

    <header class="chat-header">
        타로친구 AI
    </header>

    <div class="chat-container" id="chatContainer">
        <div class="message-row ai">
            <div class="avatar">AI</div>
            <div class="bubble">
                고민을 말해보세요. <strong>구체적일수록 좋아요.</strong>
            </div>
        </div>
    </div>

    <div class="input-wrapper-area">
        <div class="input-box">
            <input type="text" id="userInput" placeholder="메시지 타로친구 AI..." onkeypress="if(event.key==='Enter') handleChat()">
            <button class="send-btn" onclick="handleChat()">↑</button>
        </div>
    </div>

    <script>
        // 흐름: 1) 고민  2) 숫자 세 개(1~78)  3) 말투(공감형·중립형·팩폭형)  4) 결과(ㄱ 카드 → ㄴ 조합과 반응 → ㄷ 앞으로의 방향과 예지)
        // 결과는 규칙으로 조립한 샘플이다. 실제 AI 답을 쓰려면 서버 연결이 필요하다.
        const MAJOR = ['바보','마법사','여사제','여황제','황제','교황','연인','전차','힘','은둔자','운명의 수레바퀴','정의','매달린 사람','죽음','절제','악마','탑','별','달','태양','심판','세계'];
        const RANKS = ['에이스','2','3','4','5','6','7','8','9','10','시종','기사','여왕','왕'];
        const SUITS = ['완드','컵','소드','펜타클'];
        const PLACES = ["창가 자리 카페","동네 공원 벤치","도서관 열람실 창가","한강 산책로","편의점 앞 평상","시장 국숫집","골목 책방","옥상 텃밭","오래된 극장 로비","버스 정류장 앞 빵집","세탁소 앞 나무 의자","지하철역 앞 꽃집","동네 찻집 2층 창가","학교 앞 문구점","강변 자전거 도로","전통시장 떡집","작은 미술관 마당","바닷가 등대 카페","대형서점 구석 자리","동네 빨래방 대기실","공원 산책로 정자","오래된 식당 구석 자리","산 아래 약수터 벤치","역 앞 분식집","주말 플리마켓 입구","한옥 마을 골목 찻집","고궁 돌담길","아파트 놀이터 그네","백화점 지하 베이커리","동네 서점 신간 코너","교회 앞 작은 쉼터","동네 떡볶이집 창가","공원 연못 옆 정자","대학가 뒷골목 카페","한강 편의점 야외 테이블","해질 무렵 옥상 난간","시골 장터 국밥집","역사 박물관 중정","호수공원 산책 데크","동네 만화방 구석","사찰 입구 찻집","보건소 앞 공원 의자","헌책방 계단 위 자리","주차장 옆 벚나무 아래","아파트 단지 정자","아침 시장 생선 가게 뒤","공항 3층 전망 카페","바닷가 방파제 끝","시내 공공도서관 로비 소파","동네 수영장 휴게실"];
        const ITEMS = ["작은 메모장","접이식 우산","화분 하나","머그잔","손수건","열쇠고리","얇은 가디건","손목시계","책 한 권","노란 볼펜","작은 거울","텀블러","향초","종이 달력","천 토트백","캔 커피 한 개","필름 카메라","작은 나침반","민트색 머리끈","오래된 엽서","동전지갑","스케치북","가벼운 운동화","원목 도마","라디오","야광 스티커","꽃 한 송이","물병","파란 바람막이","오래된 사진 한 장","오래 쓴 지갑","낡은 운동화끈","작은 방석","수첩 한 권","휴대용 빗","은색 반지 하나","와인색 목도리","컵받침 한 장","동그란 손전등","챙 넓은 모자","얇은 면 앞치마","조약돌 하나","작은 쿠션","방울 키링","작은 시집","오래된 시계 줄","소형 블루투스 스피커","체크무늬 담요 한 장","도자기 찻잔","작은 소금통"];
        const TIMES = ['이번 여름쯤','가을이 깊어질 무렵','내년 3월쯤','2년 뒤 봄쯤','겨울이 끝나갈 무렵','3년 뒤 가을쯤','내년 11월쯤','이번 가을쯤','내년 여름쯤','2년 뒤 겨울쯤','내년 봄쯤','3년 뒤 봄쯤'];
        const HELPERS = ['차분히 일을 나눠 줄 수 있는 사람','말은 적어도 믿을 수 있는 사람','같은 고민을 먼저 꺼내 준 사람'];
        const BODY = ['수면 리듬이 먼저 흔들리기 쉬우니 잠드는 시간을 일정하게 맞춰 보세요','피로가 몸에 먼저 올라오기 쉬우니 식사와 쉬는 시간을 챙기세요','소화나 두통 같은 컨디션 신호가 나오면 하던 일을 잠시 멈추고 쉬세요'];
        const ACTIONS = ['밀린 일을 종이에 전부 적고, 오늘 안 해도 되는 것부터 지우기','도움을 청할 사람 한 명을 정해서 우선순위만 같이 봐 달라고 하기','답을 기다리며 화면을 자꾸 켜보지 않고, 확인 시간을 하루 두 번으로 정하기'];
        const LINES = ['"이번 주에 시간 괜찮은 날 있어? 같이 커피 한잔하고 싶은데."','"이건 마감을 하루만 조정할 수 있을까?"','"이번 주에 밀린 게 좀 많아서, 우선순위 10분만 같이 봐줄 수 있어?"'];

        // 타로친구AI 서버(채팅 데모). 이 컴퓨터에서 켜져 있어야 실제 AI 답이 나온다. 꺼져 있으면 샘플 결과를 보여 준다.
const SERVER = ''; // 공개본은 서버 없이 샘플 결과만 보여 준다
const KEY = '';

let step = 0, concern = '', nums = [], tone = '', readingDone = false;
let hist = [{ role: 'ai', text: '고민을 말해보세요. 구체적일수록 좋아요.' }];

        function cardName(n) {
            if (n <= 22) return MAJOR[n - 1];
            const i = n - 23;
            return SUITS[Math.floor(i / 14)] + ' ' + RANKS[i % 14];
        }

        function parseNums(text) {
            const found = (text.match(/\d+/g) || []).map(Number).filter(n => n >= 1 && n <= 78);
            const unique = [...new Set(found)];
            return unique.length === 3 ? unique : null;
        }

        function parseTone(text) {
            if (/공감/.test(text)) return '공감';
            if (/팩폭/.test(text)) return '팩폭';
            if (/중립|무난/.test(text)) return '중립';
            return '';
        }

        function handleChat() {
            const input = document.getElementById("userInput");
            const text = input.value.trim();
            if (!text) return;
            appendMessage(text, 'user');
            input.value = "";
            setTimeout(() => respond(text), 600);
        }

        function respond(text) {
            if (step === 0) {
                concern = text;
                appendMessage(`말씀하신 "${text}" 잘 들었어요. 먼저 마음이 가는 <strong>1부터 78까지 숫자 세 개</strong>를 골라 주세요. 예: 16, 38, 37`, 'ai');
                step = 1;
                return;
            }
            if (step === 1) {
                const picked = parseNums(text);
                if (!picked) {
                    appendMessage('숫자 세 개를 1~78 안에서, 겹치지 않게 적어 주세요. 예: 16, 38, 37', 'ai');
                    return;
                }
                nums = picked;
                const t = parseTone(text);
                if (t) { tone = t; return giveReading(); }
                appendMessage('좋아요. 말투는 어떻게 할까요?', 'ai');
                appendChips(['공감형', '중립형', '팩폭형'], label => { tone = parseTone(label); giveReading(); });
                step = 2;
                return;
            }
            if (step === 2) {
                const t = parseTone(text);
                if (!t) { appendMessage('공감형, 중립형, 팩폭형 중에 골라 주세요.', 'ai'); return; }
                tone = t;
                return giveReading();
            }
            askServer();
        }

        function giveReading() {
            step = 3;
            askServer();
        }

        async function askServer() {
            const bubble = appendMessage('…', 'ai', true);
            bubble.style.whiteSpace = 'pre-wrap';
            let acc = '';
            try {
                const r = await fetch(SERVER + '/chat', {
                    method: 'POST',
                    headers: { 'content-type': 'application/json', 'x-key': KEY },
                    body: JSON.stringify({ messages: hist })
                });
                if (!r.ok || !r.body) throw new Error('bad status ' + r.status);
                const reader = r.body.getReader();
                const dec = new TextDecoder();
                let buf = '';
                for (;;) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    buf += dec.decode(value, { stream: true });
                    let i;
                    while ((i = buf.indexOf('\n\n')) >= 0) {
                        const line = buf.slice(0, i);
                        buf = buf.slice(i + 2);
                        if (!line.startsWith('data: ')) continue;
                        const j = JSON.parse(line.slice(6));
                        if (j.reset) acc = '';
                        if (j.t) acc += j.t;
                        if (j.error) throw new Error(j.error);
                        bubble.textContent = acc || '…';
                        document.getElementById('chatContainer').scrollTop = 1e9;
                    }
                }
                if (!acc.trim()) throw new Error('empty');
                bubble.textContent = acc.trim();
                hist.push({ role: 'ai', text: acc.trim() });
                readingDone = true;
                step = 3;
            } catch (e) {
                if (!readingDone) {
                    bubble.textContent = '서버에 연결하지 못해서 샘플 결과로 보여 드릴게요. (이 컴퓨터에서 타로친구AI 서버를 켜 주세요.)';
                    sampleReading();
                } else {
                    bubble.textContent = '서버에 연결하지 못했어요. 서버를 켜고 다시 말씀해 주세요.';
                }
            }
        }

        function sampleReading() {
            step = 3; readingDone = true;
            const [a, b, c] = nums.map(cardName);
            const [n1, n2, n3] = nums;
            const sum = n1 + n2 + n3;
            const mid = [...nums].sort((x, y) => x - y)[1];
            const luckyA = (sum % 9) + 1;
            let luckyB = (mid % 9) + 1;
            if (luckyB === luckyA) luckyB = (luckyB % 9) + 1;
            const place = PLACES[(n1 % 50 === 0 ? 50 : n1 % 50) - 1];
            const item = ITEMS[(n2 % 50 === 0 ? 50 : n2 % 50) - 1];
            const time = TIMES[(sum * 7) % 12];
            const body = BODY[sum % 3], helper = HELPERS[sum % 3], action = ACTIONS[sum % 3], line = LINES[sum % 3];

            const open = { '공감': '이렇게 나왔어요.', '중립': '이렇게 나왔습니다.', '팩폭': '결과 나왔다. 셋 다 말해줄게.' }[tone];
            const react = {
                '공감': `${a}가 먼저 짚어주는 건 지금 마음의 무게예요. 많이 애쓰셨을 것 같아요. ${b}는 놓치고 있던 관점을, ${c}는 앞으로 취할 태도를 보여줘요. 세 장을 같이 보면 "그래도 길은 있다"에 가깝게 읽혀요.`,
                '중립': `${a}는 지금의 흐름, ${b}는 놓치고 있는 관점, ${c}는 취할 태도로 읽힙니다. 세 장이 같은 상황을 두고 방향이 조금씩 엇갈린다는 점이 핵심이에요.`,
                '팩폭': `${a}는 지금 네가 버티는 중이라는 뜻이고, ${b}는 그걸 혼자 하고 있다는 얘기야. ${c}는 "이제 바꿔라"야. 셋이 정반대를 가리켜서 긴장이 생겨. 솔직히 이 조합 보고 좀 놀랐다.`
            }[tone];
            const future = {
                '공감': `${time} 마음이 조금 흔들릴 수 있어요. ${place} 같은 편한 자리가 힘이 되어 줄 거예요. 잘 맞는 숫자는 ${luckyA}, ${luckyB}이고, 곁에 있을 물건은 ${item}이에요. 귀인은 ${helper}이에요. ${body}.`,
                '중립': `${time} 흐름이 바뀔 수 있어요. 잘 맞는 숫자는 ${luckyA}, ${luckyB}이고, 장소는 ${place}, 물건은 ${item}입니다. 귀인은 ${helper}입니다. 조심할 점은 ${body}.`,
                '팩폭': `${time} 이 흐름이 확 올라와. 숫자는 ${luckyA}, ${luckyB} 두 개가 걸려. 장소는 ${place}, 물건은 ${item}. 귀인은 ${helper}이야. 건강은 잊지 마. ${body}.`
            }[tone];
            const act = {
                '공감': `이번 주에는 ${action}부터 해 보세요. 이런 문장으로 시작해도 괜찮아요. ${line}`,
                '중립': `이번 주에는 ${action}. 이런 문장을 보내 보세요. ${line}`,
                '팩폭': `이번 주에 해. ${action}. 이렇게 보내. ${line} 이 문장이 빠지면 덜 끝난 거야.`
            }[tone];

            appendMessage(`<strong>[ㄱ] 뽑힌 카드</strong><br>${open} <strong>${a} · ${b} · ${c}</strong>`, 'ai');
            appendMessage(`<strong>[ㄴ] 조합과 반응</strong><br>${react}`, 'ai');
            appendMessage(`<strong>[ㄷ] 앞으로의 방향</strong><br>${future}<br><br>${act}`, 'ai');
            appendMessage('더 궁금한 부분이 있으면 말씀해 주세요.', 'ai');
        }

        function followUp(text) {
            const line = { '공감': '그 부분도 같은 카드 흐름 안에서 천천히 보면 좋겠어요.', '중립': '같은 세 장의 흐름 안에서 보면 그 질문은 방향을 한 번 더 정하는 쪽에 가까워요.', '팩폭': '같은 세 장으로 보면 그건 결국 방향을 정하라는 얘기야. 짧게 답하면 그래.' }[tone];
            return `"${text}"에 대해서는, ${line}`;
        }

        function appendChips(labels, onPick) {
            const container = document.getElementById("chatContainer");
            const wrap = document.createElement("div");
            wrap.className = "chips";
            labels.forEach(label => {
                const b = document.createElement("button");
                b.className = "chip";
                b.innerText = label;
                b.onclick = () => { wrap.remove(); appendMessage(label, 'user'); setTimeout(() => onPick(label), 400); };
                wrap.appendChild(b);
            });
            container.appendChild(wrap);
            container.scrollTop = container.scrollHeight;
        }

        function appendMessage(text, sender, pending) {
            const container = document.getElementById("chatContainer");
            const row = document.createElement("div");
            row.className = `message-row ${sender}`;

            const avatar = document.createElement("div");
            avatar.className = "avatar";
            avatar.innerText = sender === 'ai' ? 'AI' : '나';

            const bubble = document.createElement("div");
            bubble.className = "bubble";
            bubble.innerHTML = text;

            row.appendChild(avatar);
            row.appendChild(bubble);
            container.appendChild(row);

            if (!pending) hist.push({ role: sender === 'ai' ? 'ai' : 'user', text: text.replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ') });
            container.scrollTop = container.scrollHeight;
            return bubble;
        }
    </script>
</body>
</html>
